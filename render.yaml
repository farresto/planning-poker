services:
  - type: web
    name: planning-poker
    runtime: node
    plan: free
    buildCommand: echo "No dependencies to install"
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_DOMAIN
        value: "*"
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_ID
        value: "15f1dd5b-6a1c-4882-8d66-908f180c7ae6"
