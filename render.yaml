services:
  - type: web
    name: planning-poker
    runtime: node
    plan: free
    buildCommand: echo "No dependencies to install"
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_DOMAIN
        value: gmail.com
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
